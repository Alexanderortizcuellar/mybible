[package]
name = "mybible"
version = "0.1.0"
edition = "2021"
authors = ["MyBible Engine Team"]
description = "A comprehensive Rust engine and parser for MyBible modules"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-normalization = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
regex = "1.10"
lazy_static = "1.5"
ureq = "2.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
colored = "2.1"

[dev-dependencies]
tempfile = "3.12"
